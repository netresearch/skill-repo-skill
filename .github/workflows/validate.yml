name: Validate Skill

on:
  workflow_call:
    inputs:
      shellcheck-severity:
        description: >-
          Minimum shellcheck severity that fails the job: error (default),
          warning, info or style. It exists so a repository can hold its
          pre-commit hook and this job to the SAME level — the hook runs
          shellcheck at its own default (style) unless given `args`, and a
          repository whose scripts are clean at that level should say so here
          rather than let the two gates disagree. Raise it only once the tree
          passes: a repository carrying a vendored script it does not own
          (a TYPO3 Core runTests.sh, say) stays on `error` and pins the same
          value in its hook's `args`.
        required: false
        type: string
        default: error

permissions:
  contents: read

jobs:
  validate:
    name: Skill Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netresearch/skill-repo-skill
          ref: main
          path: .skill-repo-tools
          sparse-checkout: skills/skill-repo/scripts/
          sparse-checkout-cone-mode: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Skill repos are documentation/markdown packages and never ship Python
          # dependency files (requirements*.txt, pyproject.toml, uv.lock). Setting
          # the glob to empty skips dependency-file discovery entirely, which:
          #   1. Silences the "No file matched to [...]" warning that otherwise
          #      surfaces as an annotation on every consumer PR.
          #   2. Preserves the cache key suffix (-no-dependency-glob) the action
          #      already falls back to today, so cache hit/miss behavior is
          #      unchanged for repos without lockfiles.
          # uv is used here for ad-hoc `uvx ruff` / `uv run --with pyyaml`
          # invocations that don't depend on a project lockfile.
          cache-dependency-glob: ""

      - name: Run skill validation
        run: bash .skill-repo-tools/skills/skill-repo/scripts/validate-skill.sh .

      # Root plugin.json (Agent Plugins 1.0.0) is the source of truth for the
      # shared metadata. No-op in repos that have not adopted it yet.
      - name: Check Claude manifest is in sync with plugin.json
        run: bash .skill-repo-tools/skills/skill-repo/scripts/sync-plugin-manifest.sh --check

      - name: Markdown lint defaults
        run: |
          # Provide sensible defaults if repo has no markdownlint config
          if [[ ! -f .markdownlint-cli2.jsonc ]] && [[ ! -f .markdownlint-cli2.yaml ]] && [[ ! -f .markdownlint.jsonc ]] && [[ ! -f .markdownlint.json ]]; then
            echo '{"config":{"MD013":false,"MD024":false,"MD033":false,"MD036":false,"MD040":false,"MD041":false,"MD060":false}}' > .markdownlint-cli2.jsonc
          fi

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

      - name: YAML lint defaults
        run: |
          if [[ ! -f .yamllint.yml ]] && [[ ! -f .yamllint.yaml ]] && [[ ! -f .yamllint ]]; then
            cat > .yamllint.yml << 'YAMLEOF'
          extends: default
          rules:
            comments:
              min-spaces-from-content: 1
            document-start: disable
            indentation: disable
            line-length:
              max: 200
            truthy:
              allowed-values: ['true', 'false', 'on']
          YAMLEOF
          fi

      - name: YAML lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1

      - name: actionlint (GitHub Actions workflows)
        id: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true

      # Only plugin.json was ever parsed, so a broken composer.json or
      # hooks/*.json reached main and failed wherever it was first read
      # (issue #181). This mirrors the check-json pre-commit hook, which most
      # repos do not install.
      - name: JSON syntax
        run: |
          FAILED=0
          COUNT=0
          while IFS= read -r -d '' f; do
            case "$f" in
              vendor/*|*/vendor/*|node_modules/*|*/node_modules/*) continue ;;
            esac
            COUNT=$((COUNT + 1))
            # json.tool writes the reformatted document to the second argument;
            # /dev/null keeps the check quiet and the diagnostic on stderr.
            if ! ERR=$(python3 -m json.tool "$f" /dev/null 2>&1); then
              echo "::error file=${f}::invalid JSON: ${ERR}"
              FAILED=1
            fi
          done < <(git ls-files -z '*.json')
          if [[ "$FAILED" -eq 1 ]]; then
            exit 1
          fi
          echo "${COUNT} tracked JSON file(s) parse"

      - name: Validate plugin version format
        run: |
          PLUGIN_FILE=".claude-plugin/plugin.json"
          if [[ ! -f "$PLUGIN_FILE" ]]; then
            echo "::error::$PLUGIN_FILE not found"
            exit 1
          fi
          PLUGIN_VERSION=$(python3 -c "import json; print(json.load(open('$PLUGIN_FILE'))['version'])")
          echo "plugin.json version: $PLUGIN_VERSION"
          if ! echo "$PLUGIN_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Invalid version format in plugin.json: $PLUGIN_VERSION"
            exit 1
          fi
          echo "Version format valid"

      - name: Validate SKILL.md metadata.version matches plugin.json
        run: |
          PLUGIN_FILE=".claude-plugin/plugin.json"
          PLUGIN_VERSION=$(python3 -c "import json; print(json.load(open('$PLUGIN_FILE'))['version'])")

          # Every SKILL.md, not just the first: a repo shipping several skills
          # had the others' versions unchecked, the same first-match-wins hole
          # the validator had (issue #214).
          SKILL_FILES=()
          if [[ -f "SKILL.md" ]]; then
            SKILL_FILES+=("SKILL.md")
          fi
          for f in skills/*/SKILL.md; do
            [[ -f "$f" ]] && SKILL_FILES+=("$f")
          done

          if [[ ${#SKILL_FILES[@]} -eq 0 ]]; then
            echo "No SKILL.md found, skipping"
            exit 0
          fi

          echo "plugin.json version: ${PLUGIN_VERSION}"
          MISMATCH=0
          CHECKED=0
          for SKILL_FILE in "${SKILL_FILES[@]}"; do
            # Extract version from YAML frontmatter
            SKILL_VERSION=$(sed -n '/^---$/,/^---$/p' "${SKILL_FILE}" \
              | grep -E '^\s*version:' \
              | head -1 \
              | sed 's/.*version:[[:space:]]*//' \
              | tr -d '"'"'")

            if [[ -z "${SKILL_VERSION}" ]]; then
              echo "No metadata.version in ${SKILL_FILE} frontmatter, skipping"
              continue
            fi

            CHECKED=$((CHECKED + 1))
            echo "${SKILL_FILE} version: ${SKILL_VERSION}"
            if [[ "${PLUGIN_VERSION}" != "${SKILL_VERSION}" ]]; then
              echo "::error file=${SKILL_FILE}::Version mismatch — plugin.json (${PLUGIN_VERSION}) != ${SKILL_FILE} metadata.version (${SKILL_VERSION})"
              MISMATCH=1
            fi
          done

          if [[ "${MISMATCH}" -eq 1 ]]; then
            exit 1
          fi
          if [[ "${CHECKED}" -eq 0 ]]; then
            echo "No SKILL.md declares metadata.version, nothing to compare"
            exit 0
          fi
          echo "Versions match in ${CHECKED} SKILL.md file(s)"

      - name: ShellCheck scripts
        env:
          SEVERITY: ${{ inputs.shellcheck-severity }}
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          SHELLCHECK_VERSION: '0.11.0'
          SHELLCHECK_SHA256: '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'
        run: |
          # Auto-discover shell scripts in skill directories and root scripts/
          SCRIPTS=$(find . -path './.skill-repo-tools' -prune -o -path './.git' -prune -o \
            \( -name '*.sh' -type f -print \) | sort)
          if [[ -z "$SCRIPTS" ]]; then
            echo "No shell scripts found, skipping ShellCheck"
            exit 0
          fi
          COUNT=$(echo "$SCRIPTS" | wc -l)
          echo "Found $COUNT shell script(s)"
          # The binary comes from its own release, pinned, NOT from apt: the
          # pre-commit hook pins shellcheck-py 0.11.0.x while Ubuntu 24.04
          # ships 0.9.0, and the two disagree — 0.9.0 reports SC2317 on code
          # 0.11 accepts. At `-S error` that difference was invisible; at any
          # stricter severity it makes hook and CI contradict each other over
          # the same file, which is the divergence this input exists to end.
          # It also removes the apt stall that #245 had to bound: a pinned
          # tarball with a checksum cannot hang for 37 minutes on a mirror.
          # --proto/--proto-redir pin the scheme for the request AND for the
          # redirect GitHub answers with, so -L cannot be walked onto http
          # (githubactions:S6506).
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -fsSL --max-time 120 -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          FAILED=0
          while IFS= read -r script; do
            [[ -z "$script" ]] && continue
            echo "Checking: $script"
            if ! shellcheck -x -S "$SEVERITY" "$script"; then
              FAILED=1
            fi
          done <<< "$SCRIPTS"
          if [[ $FAILED -eq 1 ]]; then
            echo "::error::ShellCheck found errors"
            exit 1
          fi
          echo "All $COUNT scripts passed ShellCheck at severity $SEVERITY"

      - name: Python lint
        run: |
          PYFILES=$(find . -path './.skill-repo-tools' -prune -o -path './.git' -prune -o \
            -name '*.py' -type f -print | sort)
          if [[ -z "$PYFILES" ]]; then
            echo "No Python files found, skipping"
            exit 0
          fi
          COUNT=$(echo "$PYFILES" | wc -l)
          echo "Found $COUNT Python file(s)"
          echo "=== ruff check ==="
          # --extend-exclude: the vendored tools checkout must not be linted
          # under the CONSUMER repo's ruff config (find above prunes it too)
          # renovate: datasource=pypi depName=ruff
          uvx --no-build ruff@0.16.0 check --extend-exclude .skill-repo-tools .
          echo "=== ruff format ==="
          # renovate: datasource=pypi depName=ruff
          uvx --no-build ruff@0.16.0 format --check --extend-exclude .skill-repo-tools .

      - name: Validate checkpoint schemas
        run: |
          CHECKPOINT_FILES=$(find . -path './.skill-repo-tools' -prune -o -path './.git' -prune -o \
            \( -name 'checkpoints.yaml' -o -name '*-checkpoints.yaml' \) -print | sort)
          if [[ -z "$CHECKPOINT_FILES" ]]; then
            echo "No checkpoint files found, skipping"
            exit 0
          fi
          COUNT=$(echo "$CHECKPOINT_FILES" | wc -l)
          echo "Found $COUNT checkpoint file(s)"
          FAILED=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            echo "=== Validating $f ==="
            uv run --no-build --with 'pyyaml==6.0.3' python3 - "$f" <<'PYEOF' || FAILED=1
          import sys, yaml
          with open(sys.argv[1]) as fh:
              data = yaml.safe_load(fh)
          if not isinstance(data, dict):
              print("ERROR: not a YAML mapping")
              sys.exit(1)
          has_mechanical = "mechanical" in data
          has_llm = "llm_reviews" in data
          if not has_mechanical and not has_llm:
              print("ERROR: must have mechanical and/or llm_reviews section")
              sys.exit(1)
          all_ids = []
          for section in ("mechanical", "llm_reviews"):
              items = data.get(section, [])
              if items is None:
                  continue
              for item in items:
                  if "id" not in item:
                      print(f"ERROR: entry in {section} missing id field")
                      sys.exit(1)
                  all_ids.append(item["id"])
          dupes = [x for x in all_ids if all_ids.count(x) > 1]
          if dupes:
              print(f"ERROR: duplicate checkpoint IDs: {set(dupes)}")
              sys.exit(1)
          m = len(data.get("mechanical", []) or [])
          l = len(data.get("llm_reviews", []) or [])
          print(f"Valid: {m} mechanical + {l} LLM review checkpoints")
          PYEOF
          done <<< "$CHECKPOINT_FILES"
          if [[ $FAILED -eq 1 ]]; then
            echo "::error::Checkpoint validation failed"
            exit 1
          fi
          echo "All $COUNT checkpoint file(s) valid"
