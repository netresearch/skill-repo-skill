name: Validate Skill

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Skill Validation
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout validation tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: netresearch/skill-repo-skill
          path: .skill-repo-tools
          sparse-checkout: skills/skill-repo/scripts/
          sparse-checkout-cone-mode: false

      - name: Run skill validation
        run: bash .skill-repo-tools/skills/skill-repo/scripts/validate-skill.sh .

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@07035fd053f7be764496c0f8d8f9f41f98305101 # v22.0.0

      - name: YAML lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1

      - name: Validate plugin version format
        run: |
          PLUGIN_FILE=".claude-plugin/plugin.json"
          if [[ ! -f "$PLUGIN_FILE" ]]; then
            echo "::error::$PLUGIN_FILE not found"
            exit 1
          fi
          PLUGIN_VERSION=$(python3 -c "import json; print(json.load(open('$PLUGIN_FILE'))['version'])")
          echo "plugin.json version: $PLUGIN_VERSION"
          if ! echo "$PLUGIN_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Invalid version format in plugin.json: $PLUGIN_VERSION"
            exit 1
          fi
          echo "Version format valid"

      - name: ShellCheck scripts
        run: |
          # Auto-discover shell scripts in skill directories and root scripts/
          SCRIPTS=$(find . -path './.skill-repo-tools' -prune -o -path './.git' -prune -o \
            \( -name '*.sh' -type f -print \) | sort)
          if [[ -z "$SCRIPTS" ]]; then
            echo "No shell scripts found, skipping ShellCheck"
            exit 0
          fi
          COUNT=$(echo "$SCRIPTS" | wc -l)
          echo "Found $COUNT shell script(s)"
          sudo apt-get update -qq > /dev/null 2>&1 && sudo apt-get install -y -qq shellcheck > /dev/null 2>&1
          FAILED=0
          while IFS= read -r script; do
            [[ -z "$script" ]] && continue
            echo "Checking: $script"
            if ! shellcheck -x -S error "$script"; then
              FAILED=1
            fi
          done <<< "$SCRIPTS"
          if [[ $FAILED -eq 1 ]]; then
            echo "::error::ShellCheck found errors"
            exit 1
          fi
          echo "All $COUNT scripts passed ShellCheck"
