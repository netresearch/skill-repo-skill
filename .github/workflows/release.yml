name: Release Skill

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  workflow_call:
    inputs:
      bump:
        description: 'Version bump type (patch/minor/major)'
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # --- Job 1: Bump version via PR (workflow_dispatch only) ---
  bump:
    name: Bump Version
    if: inputs.bump != '' && inputs.bump != null
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.calc.outputs.new_version }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Calculate new version
        id: calc
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          PLUGIN_FILE=".claude-plugin/plugin.json"
          CURRENT=$(python3 -c "import json; print(json.load(open('$PLUGIN_FILE'))['version'])")
          IFS='.' read -r major minor patch <<< "$CURRENT"

          case "$BUMP" in
            major) NEW="$((major+1)).0.0" ;;
            minor) NEW="${major}.$((minor+1)).0" ;;
            patch) NEW="${major}.${minor}.$((patch+1))" ;;
            *) echo "::error::Invalid bump type: $BUMP"; exit 1 ;;
          esac

          echo "Bumping $CURRENT → $NEW"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Bump plugin.json and SKILL.md
        env:
          NEW: ${{ steps.calc.outputs.new_version }}
        run: |
          set -euo pipefail
          PLUGIN_FILE=".claude-plugin/plugin.json"

          # Update plugin.json
          python3 -c "
          import json, pathlib
          p = pathlib.Path('$PLUGIN_FILE')
          data = json.loads(p.read_text())
          data['version'] = '$NEW'
          p.write_text(json.dumps(data, indent=2) + '\n')
          "

          # Update SKILL.md frontmatter version(s)
          SKILL_PATHS=$(python3 -c "
          import json
          data = json.load(open('$PLUGIN_FILE'))
          skills = data.get('skills', [])
          if isinstance(skills, str): skills = [skills]
          for s in skills: print(s.strip('/').rstrip('/'))
          ")
          while IFS= read -r sp; do
            [[ -z "$sp" ]] && continue
            SM="${sp#./}/SKILL.md"
            [[ -f "$SM" ]] && sed -i "s/^  version: \".*\"/  version: \"$NEW\"/" "$SM"
          done <<< "$SKILL_PATHS"

      - name: Create release PR
        id: pr
        env:
          NEW: ${{ steps.calc.outputs.new_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="release/v$NEW"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: release v$NEW"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore: release v$NEW" \
            --body "Automated version bump to v$NEW. Merge to release." \
            --head "$BRANCH" \
            --base main)
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Created $PR_URL"

      - name: Merge release PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          # Wait for any required checks
          sleep 10
          gh pr merge "$PR_NUMBER" --merge --admin --delete-branch

      - name: Create signed tag via API
        env:
          NEW: ${{ steps.calc.outputs.new_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMIT_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')

          # Create annotated tag object (GitHub signs it)
          gh api "repos/${{ github.repository }}/git/tags" \
            -f tag="v$NEW" \
            -f message="Release v$NEW" \
            -f object="$COMMIT_SHA" \
            -f type="commit"

          # Create tag ref
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/v$NEW" \
            -f sha="$COMMIT_SHA"

          echo "Created tag v$NEW at $COMMIT_SHA"

  # --- Job 2: Build and release (runs on tag push OR after bump) ---
  release:
    name: Create Release
    needs: [bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Determine tag version
        id: version
        run: |
          if [[ -n "${{ needs.bump.outputs.new_version }}" ]]; then
            echo "tag=v${{ needs.bump.outputs.new_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout at tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Validate version and build packages
        env:
          TAG_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          PLUGIN_FILE=".claude-plugin/plugin.json"

          # --- Validate version ---
          PLUGIN_VERSION=$(python3 -c "import json; print(json.load(open('$PLUGIN_FILE'))['version'])")
          PLUGIN_NAME=$(python3 -c "import json; print(json.load(open('$PLUGIN_FILE'))['name'])")
          TAG_BARE="${TAG_VERSION#v}"
          if [[ "$TAG_BARE" != "$PLUGIN_VERSION" ]]; then
            echo "::error file=$PLUGIN_FILE::Tag $TAG_VERSION does not match plugin.json version $PLUGIN_VERSION"
            exit 1
          fi
          echo "Version validated: $TAG_VERSION"

          # --- Discover skills from plugin.json ---
          SKILL_PATHS=$(python3 -c "
          import json
          data = json.load(open('$PLUGIN_FILE'))
          skills = data.get('skills', [])
          if isinstance(skills, str):
              skills = [skills]
          for s in skills:
              print(s.strip('/').rstrip('/'))
          ")

          mkdir -p dist/releases

          # --- Helper: copy skill contents ---
          copy_skill() {
            local src="$1" dst="$2"
            for item in SKILL.md references scripts assets templates examples; do
              if [[ -e "$src/$item" ]]; then
                cp -r "$src/$item" "$dst/"
              fi
            done
            [[ -f "$src/checkpoints.yaml" ]] && cp "$src/checkpoints.yaml" "$dst/"
            cp LICENSE-MIT LICENSE-CC-BY-SA-4.0 "$dst/" 2>/dev/null || true
          }

          # --- Package each skill standalone ---
          while IFS= read -r skill_path; do
            [[ -z "$skill_path" ]] && continue
            skill_path="${skill_path#./}"

            if [[ "$skill_path" == "." ]]; then
              SKILL_NAME="$PLUGIN_NAME"
              SKILL_SRC="."
            else
              SKILL_NAME=$(basename "$skill_path")
              SKILL_SRC="$skill_path"
            fi

            echo "=== Packaging standalone skill: $SKILL_NAME ==="
            SKILL_DIST="dist/skill-$SKILL_NAME"
            mkdir -p "$SKILL_DIST"
            copy_skill "$SKILL_SRC" "$SKILL_DIST"

            (cd "$SKILL_DIST" && zip -qr "../releases/${SKILL_NAME}-skill-${TAG_VERSION}.zip" .)
            (cd "$SKILL_DIST" && tar -czf "../releases/${SKILL_NAME}-skill-${TAG_VERSION}.tar.gz" .)
            echo "Created ${SKILL_NAME}-skill-${TAG_VERSION}.zip/.tar.gz"
          done <<< "$SKILL_PATHS"

          # --- Package full plugin ---
          echo "=== Packaging plugin: $PLUGIN_NAME ==="
          PLUGIN_DIST="dist/plugin"
          mkdir -p "$PLUGIN_DIST"

          while IFS= read -r skill_path; do
            [[ -z "$skill_path" ]] && continue
            skill_path="${skill_path#./}"

            if [[ "$skill_path" == "." ]]; then
              copy_skill "." "$PLUGIN_DIST"
            else
              mkdir -p "$PLUGIN_DIST/$skill_path"
              copy_skill "$skill_path" "$PLUGIN_DIST/$skill_path"
            fi
          done <<< "$SKILL_PATHS"

          cp LICENSE-MIT LICENSE-CC-BY-SA-4.0 "$PLUGIN_DIST/" 2>/dev/null || true
          [[ -d ".claude-plugin" ]] && cp -r .claude-plugin "$PLUGIN_DIST/"
          [[ -d "hooks" ]] && cp -r hooks "$PLUGIN_DIST/"
          if [[ -d "scripts" ]]; then
            cp -r scripts "$PLUGIN_DIST/"
            find "$PLUGIN_DIST/scripts" -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          fi

          (cd "$PLUGIN_DIST" && zip -qr "../releases/${PLUGIN_NAME}-plugin-${TAG_VERSION}.zip" .)
          (cd "$PLUGIN_DIST" && tar -czf "../releases/${PLUGIN_NAME}-plugin-${TAG_VERSION}.tar.gz" .)
          echo "Created ${PLUGIN_NAME}-plugin-${TAG_VERSION}.zip/.tar.gz"

          # --- Checksums ---
          (cd dist/releases && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          echo ""
          echo "=== Release packages ==="
          ls -lh dist/releases/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/releases/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
