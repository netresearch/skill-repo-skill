# Python tests and an optional Bandit scan for skill repos that ship Python.
#
# Scope: Python only. Shell linting is NOT here -- validate.yml already runs
# ShellCheck over every repo, and a second gate in a workflow only Python repos
# call would leave shell scripts unchecked wherever ci-python.yml is not used
# (issue #180).
name: Python CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test
        type: string
        default: '["3.12", "3.13"]'
      test-command:
        description: >-
          Command to run for testing. The matrix interpreter is installed and
          exported as both PYTHON_VERSION and UV_PYTHON, so a plain `uv run
          pytest` already uses it; anything invoking python directly should use
          `uv run --python "$PYTHON_VERSION" ...` so the matrix is real.
        type: string
        required: true
      run-bandit:
        description: Run Bandit security scan
        type: boolean
        default: false
      bandit-args:
        description: Arguments for Bandit
        type: string
        default: '-r scripts/ --severity-level medium'
      upload-coverage:
        description: Upload coverage to Codecov
        type: boolean
        default: false
      coverage-files:
        description: Coverage file pattern
        type: string
        default: 'coverage.xml'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions: {}

jobs:
  bandit:
    name: Bandit Security Scan
    if: ${{ inputs.run-bandit }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Default glob plus workflow files: callers without Python dependency
          # files (standalone scripts, uv run --with) otherwise get a
          # "No file matched" warning annotation on every run.
          cache-dependency-glob: |
            **/*requirements*.txt
            **/*requirements*.in
            **/*constraints*.txt
            **/*constraints*.in
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock
            .github/workflows/*.yml
            .github/workflows/*.yaml

      # Second checkout: this workflow runs in the CALLER's repo, so the
      # hash-locked tool requirements must come from skill-repo-skill itself.
      - name: Fetch locked tool requirements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netresearch/skill-repo-skill
          ref: main
          path: .skill-repo-ci
          persist-credentials: false
          sparse-checkout: |
            .github/requirements
          sparse-checkout-cone-mode: false

      - name: Run Bandit
        env:
          BANDIT_ARGS: ${{ inputs.bandit-args }}
        run: |
          # Hash-locked tool env: requirements compiled with
          # `uv pip compile --universal --generate-hashes`; --require-hashes
          # rejects any artifact not pinned by digest, --only-binary blocks
          # sdist setup scripts. Bump via .github/requirements/bandit.txt.
          python3 -m venv "$RUNNER_TEMP/bandit-env"
          "$RUNNER_TEMP/bandit-env/bin/pip" install --quiet --require-hashes --only-binary :all: -r .skill-repo-ci/.github/requirements/bandit.txt
          # shellcheck disable=SC2086  # intentional: BANDIT_ARGS is a list of flags
          "$RUNNER_TEMP/bandit-env/bin/bandit" $BANDIT_ARGS

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Installs this interpreter and sets UV_PYTHON to it. Without it the
          # matrix only exported a version string, so a caller writing plain
          # `uv run pytest` tested the runner's default interpreter N times and
          # the matrix silently guaranteed nothing (issue #179).
          python-version: ${{ matrix.python }}
          # Default glob plus workflow files: callers without Python dependency
          # files (standalone scripts, uv run --with) otherwise get a
          # "No file matched" warning annotation on every run.
          cache-dependency-glob: |
            **/*requirements*.txt
            **/*requirements*.in
            **/*constraints*.txt
            **/*constraints*.in
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock
            .github/workflows/*.yml
            .github/workflows/*.yaml

      # The matrix is only a guarantee if the interpreter actually follows it.
      # Asserted rather than printed: a version input that silently falls back
      # to the runner's default would otherwise look like a passing matrix.
      - name: Assert the matrix interpreter is the one uv resolves
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          # setup-uv's python-version only exports UV_PYTHON; installing it here
          # makes an unavailable version fail with its own message instead of
          # surfacing inside the caller's test command.
          uv python install "$PYTHON_VERSION"
          RESOLVED=$(uv run --no-project python3 -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
          echo "matrix version : $PYTHON_VERSION"
          echo "uv resolves to : $RESOLVED"
          case "$RESOLVED" in
            "$PYTHON_VERSION"|"$PYTHON_VERSION".*) ;;
            *) echo "::error::uv resolves to $RESOLVED, not the matrix version $PYTHON_VERSION — the matrix is not testing what it claims"; exit 1 ;;
          esac

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        # zizmor: ignore[template-injection] -- caller-supplied test command; this reusable
        # workflow runs it verbatim by design. Input comes from the trusted calling repo, not
        # external/untrusted context, and may be a compound command (a && b) so env indirection
        # would change behaviour.
        run: ${{ inputs.test-command }}

      - name: Upload coverage
        if: ${{ inputs.upload-coverage && matrix.python == fromJSON(inputs.python-versions)[0] }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ inputs.coverage-files }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
