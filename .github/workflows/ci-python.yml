name: Python CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test
        type: string
        default: '["3.12", "3.13"]'
      test-command:
        description: Command to run for testing (receives PYTHON_VERSION env var)
        type: string
        required: true
      run-bandit:
        description: Run Bandit security scan
        type: boolean
        default: false
      bandit-args:
        description: Arguments for Bandit
        type: string
        default: '-r scripts/ --severity-level medium'
      upload-coverage:
        description: Upload coverage to Codecov
        type: boolean
        default: false
      coverage-files:
        description: Coverage file pattern
        type: string
        default: 'coverage.xml'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions: {}

jobs:
  bandit:
    name: Bandit Security Scan
    if: ${{ inputs.run-bandit }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Run Bandit
        env:
          BANDIT_ARGS: ${{ inputs.bandit-args }}
        run: |
          # shellcheck disable=SC2086  # intentional: BANDIT_ARGS is a list of flags
          uv run --with bandit bandit $BANDIT_ARGS

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        # zizmor: ignore[template-injection] -- caller-supplied test command; this reusable
        # workflow runs it verbatim by design. Input comes from the trusted calling repo, not
        # external/untrusted context, and may be a compound command (a && b) so env indirection
        # would change behaviour.
        run: ${{ inputs.test-command }}

      - name: Upload coverage
        if: ${{ inputs.upload-coverage && matrix.python == fromJSON(inputs.python-versions)[0] }}
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: ${{ inputs.coverage-files }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
