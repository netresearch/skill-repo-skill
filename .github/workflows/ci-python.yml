name: Python CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test
        type: string
        default: '["3.12", "3.13"]'
      test-command:
        description: Command to run for testing (receives PYTHON_VERSION env var)
        type: string
        required: true
      run-bandit:
        description: Run Bandit security scan
        type: boolean
        default: false
      bandit-args:
        description: Arguments for Bandit
        type: string
        default: '-r scripts/ --severity-level medium'
      upload-coverage:
        description: Upload coverage to Codecov
        type: boolean
        default: false
      coverage-files:
        description: Coverage file pattern
        type: string
        default: 'coverage.xml'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions: {}

jobs:
  bandit:
    name: Bandit Security Scan
    if: ${{ inputs.run-bandit }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # Default glob plus workflow files: callers without Python dependency
          # files (standalone scripts, uv run --with) otherwise get a
          # "No file matched" warning annotation on every run.
          cache-dependency-glob: |
            **/*requirements*.txt
            **/*requirements*.in
            **/*constraints*.txt
            **/*constraints*.in
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock
            .github/workflows/*.yml
            .github/workflows/*.yaml

      # Second checkout: this workflow runs in the CALLER's repo, so the
      # hash-locked tool requirements must come from skill-repo-skill itself.
      - name: Fetch locked tool requirements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netresearch/skill-repo-skill
          ref: main
          path: .skill-repo-ci
          persist-credentials: false
          sparse-checkout: |
            .github/requirements
          sparse-checkout-cone-mode: false

      - name: Run Bandit
        env:
          BANDIT_ARGS: ${{ inputs.bandit-args }}
        run: |
          # shellcheck disable=SC2086  # intentional: BANDIT_ARGS is a list of flags
          # Hash-locked resolution (uv pip compile --universal --generate-hashes);
          # wheels only. Bump via .github/requirements/bandit.txt, not here.
          uv run --no-build --with-requirements .skill-repo-ci/.github/requirements/bandit.txt bandit $BANDIT_ARGS

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # Default glob plus workflow files: callers without Python dependency
          # files (standalone scripts, uv run --with) otherwise get a
          # "No file matched" warning annotation on every run.
          cache-dependency-glob: |
            **/*requirements*.txt
            **/*requirements*.in
            **/*constraints*.txt
            **/*constraints*.in
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock
            .github/workflows/*.yml
            .github/workflows/*.yaml

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        # zizmor: ignore[template-injection] -- caller-supplied test command; this reusable
        # workflow runs it verbatim by design. Input comes from the trusted calling repo, not
        # external/untrusted context, and may be a compound command (a && b) so env indirection
        # would change behaviour.
        run: ${{ inputs.test-command }}

      - name: Upload coverage
        if: ${{ inputs.upload-coverage && matrix.python == fromJSON(inputs.python-versions)[0] }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ inputs.coverage-files }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
