# Python tests and an optional Bandit scan for skill repos that ship Python.
#
# Scope: Python only. Shell linting is NOT here -- validate.yml already runs
# ShellCheck over every repo, and a second gate in a workflow only Python repos
# call would leave shell scripts unchecked wherever ci-python.yml is not used
# (issue #180).
name: Python CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test
        type: string
        default: '["3.12", "3.13", "3.14"]'
      test-command:
        description: >-
          Command to run for testing. The matrix interpreter is installed and
          exported as both PYTHON_VERSION and UV_PYTHON, so a plain `uv run
          pytest` already uses it; anything invoking python directly should use
          `uv run --python "$PYTHON_VERSION" ...` so the matrix is real.
        type: string
        required: true
      run-bandit:
        description: Run Bandit security scan
        type: boolean
        default: false
      bandit-args:
        description: Arguments for Bandit
        type: string
        default: '-r scripts/ --severity-level medium'
      upload-coverage:
        description: Upload coverage to Codecov
        type: boolean
        default: false
      coverage-files:
        description: Coverage file pattern
        type: string
        default: 'coverage.xml'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions: {}

jobs:
  bandit:
    name: Bandit Security Scan
    if: ${{ inputs.run-bandit }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # Default glob plus workflow files: callers without Python dependency
          # files (standalone scripts, uv run --with) otherwise get a
          # "No file matched" warning annotation on every run.
          cache-dependency-glob: |
            **/*requirements*.txt
            **/*requirements*.in
            **/*constraints*.txt
            **/*constraints*.in
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock
            .github/workflows/*.yml
            .github/workflows/*.yaml

      # Second checkout: this workflow runs in the CALLER's repo, so the
      # hash-locked tool requirements must come from skill-repo-skill itself.
      - name: Fetch locked tool requirements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netresearch/skill-repo-skill
          ref: main
          path: .skill-repo-ci
          persist-credentials: false
          sparse-checkout: |
            .github/requirements
          sparse-checkout-cone-mode: false

      - name: Run Bandit
        env:
          BANDIT_ARGS: ${{ inputs.bandit-args }}
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
        run: |
          # Bandit parses with the ast of the interpreter it RUNS on, and a file
          # it cannot parse is skipped with a warning and exit 0 -- so the scan
          # reports clean instead of reporting that it scanned nothing. Measured
          # on 2026-09-17: a file using PEP 696 (`class Box[T = int]`, 3.13+)
          # with a `subprocess.call(..., shell=True)` under it is reported as
          # "Files skipped (1): syntax error while parsing AST" and B602 never
          # fires; on 3.14 the same file fails as it should.
          #
          # `python3 -m venv` gave that interpreter to the runner image, which
          # is 3.12.3 on ubuntu-latest today -- the OLDEST version most callers
          # test, not the newest. Take the newest version the caller tests and
          # install it, so the scan can parse everything the matrix accepts.
          # gsub: a caller may test a free-threaded build ("3.13t"), and a bare
          # tonumber on that part aborts the job -- which would be a scan lost
          # to a version string, on callers this job used to serve by ignoring
          # python-versions entirely. Compare on the digits, install the value
          # as written.
          BANDIT_PYTHON="$(printf '%s' "$PYTHON_VERSIONS" \
            | jq -r 'max_by(split(".") | map(gsub("[^0-9]";"") | tonumber? // 0))')"
          if [[ -z "$BANDIT_PYTHON" || "$BANDIT_PYTHON" == "null" ]]; then
            echo "::error::python-versions yielded no interpreter for the bandit scan: $PYTHON_VERSIONS"; exit 1
          fi
          uv python install "$BANDIT_PYTHON"
          uv venv --seed --python "$BANDIT_PYTHON" "$RUNNER_TEMP/bandit-env"
          # Asserted rather than assumed, for the same reason as the test job's
          # interpreter check below: a venv on the wrong interpreter still runs.
          "$RUNNER_TEMP/bandit-env/bin/python" -V
          # `python -V` reports 3.13.x for a "3.13t" request, so compare on the
          # numeric prefix; matching the request verbatim would fail the job on
          # exactly the free-threaded build the gsub above exists to allow.
          want="${BANDIT_PYTHON%%[!0-9.]*}"
          case "$("$RUNNER_TEMP/bandit-env/bin/python" -V)" in
            "Python $want"|"Python $want".*) ;;
            *) echo "::error::bandit venv is not on $BANDIT_PYTHON -- the scan would parse with a different ast than the matrix tests"; exit 1 ;;
          esac
          # Hash-locked tool env: requirements compiled with
          # `uv pip compile --universal --generate-hashes --python-version 3.12`;
          # the floor matters: compiled on a newer interpreter, uv drops
          # deps whose marker excludes it (typing_extensions is required
          # by cyclonedx-python-lib only below 3.13) and the install then
          # fails here, not at compile time. --require-hashes
          # rejects any artifact not pinned by digest, --only-binary blocks
          # sdist setup scripts. Bump via .github/requirements/bandit.txt.
          # `uv venv --seed` is what puts the pip that reads it into the venv;
          # verified on 3.14 that the 3.12-compiled lock installs unchanged.
          "$RUNNER_TEMP/bandit-env/bin/pip" install --quiet --require-hashes --only-binary :all: -r .skill-repo-ci/.github/requirements/bandit.txt
          # shellcheck disable=SC2086  # intentional: BANDIT_ARGS is a list of flags
          "$RUNNER_TEMP/bandit-env/bin/bandit" $BANDIT_ARGS

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # Installs this interpreter and sets UV_PYTHON to it. Without it the
          # matrix only exported a version string, so a caller writing plain
          # `uv run pytest` tested the runner's default interpreter N times and
          # the matrix silently guaranteed nothing (issue #179).
          python-version: ${{ matrix.python }}
          # Default glob plus workflow files: callers without Python dependency
          # files (standalone scripts, uv run --with) otherwise get a
          # "No file matched" warning annotation on every run.
          cache-dependency-glob: |
            **/*requirements*.txt
            **/*requirements*.in
            **/*constraints*.txt
            **/*constraints*.in
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock
            .github/workflows/*.yml
            .github/workflows/*.yaml

      # The matrix is only a guarantee if the interpreter actually follows it,
      # and the failure mode is silent: a version input that does not take
      # effect still produces N green jobs with N different names.
      #
      # Two things make it a guarantee, so both are asserted rather than
      # assumed. UV_PYTHON is what steers `uv run` — measured directly:
      # `UV_PYTHON=3.12 uv run --no-project python3 -V` answers 3.12.13 on a
      # machine whose default is 3.14. setup-uv sets it from python-version;
      # if a future version stops doing that, this step says so instead of the
      # matrix quietly collapsing onto one interpreter.
      - name: Assert the matrix interpreter is installed and selected
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          # Explicit install: an unavailable version fails here, with uv's own
          # message, rather than inside the caller's test command.
          uv python install "$PYTHON_VERSION"
          echo "matrix version : $PYTHON_VERSION"
          echo "UV_PYTHON      : ${UV_PYTHON:-<unset>}"
          if [[ -z "${UV_PYTHON:-}" ]]; then
            echo "::error::UV_PYTHON is unset — setup-uv did not apply python-version, so uv run would pick the runner default and every matrix entry would test the same interpreter"; exit 1
          fi
          case "$UV_PYTHON" in
            "$PYTHON_VERSION"|"$PYTHON_VERSION".*) ;;
            *) echo "::error::UV_PYTHON is $UV_PYTHON, not the matrix version $PYTHON_VERSION — the matrix is not testing what it claims"; exit 1 ;;
          esac

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        # zizmor: ignore[template-injection] -- caller-supplied test command; this reusable
        # workflow runs it verbatim by design. Input comes from the trusted calling repo, not
        # external/untrusted context, and may be a compound command (a && b) so env indirection
        # would change behaviour.
        run: ${{ inputs.test-command }}

      - name: Upload coverage
        if: ${{ inputs.upload-coverage && matrix.python == fromJSON(inputs.python-versions)[0] }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ inputs.coverage-files }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
