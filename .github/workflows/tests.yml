name: Skill Tests

# Runs a skill repo's own test suite. Skill repos ship executable surface —
# scripts under skills/*/scripts/ — but every workflow in the template set was
# a thin caller of a *validator*: lint, structure, evals, security. None of them
# ran anything under tests/. Across the fleet that left 276 shipped scripts in
# 27 repos with no test that any pipeline executes, and defects that survive
# indefinitely because nothing exercises the code (a `set -e` + `((VAR++))`
# abort skipped 11 of 12 sections of one verifier for years).
#
# A test nothing runs is not a gate. This workflow is the gate.

on:
  workflow_call:
    inputs:
      shell_glob:
        description: "Glob for shell test files, relative to the repo root."
        required: false
        type: string
        default: "tests/**/*.sh"
      python_glob:
        description: "Glob for Python test files, relative to the repo root."
        required: false
        type: string
        default: "tests/**/*.py"
      php_glob:
        description: >-
          Glob for PHP test entrypoints, relative to the repo root. Every match
          is executed, so a repo keeping fixtures under tests/ narrows this to
          the entrypoints (for example "tests/run.php") rather than letting the
          default sweep tests/fixtures/ as well.
        required: false
        type: string
        default: "tests/**/*.php"
      php_version:
        description: "PHP version used when PHP tests are present."
        required: false
        type: string
        default: "8.3"
      require_tests:
        description: >-
          Fail when the repo ships scripts under skills/*/scripts/ but matches
          no test files. Default false: a repo without tests only gets a
          warning, so adopting this workflow never breaks a repo on day one.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Skill Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here talks to the remote; leaving the token in .git/config
          # only exposes it to later steps and artifacts.
          persist-credentials: false

      # PHP first: the toolchain and dependencies are installed before any leg
      # runs, so a shell test that shells out to php finds them too. A shell
      # wrapper around a PHP suite otherwise reports green while the suite
      # skips itself for a missing vendor/ — observed on php-ast-edit-skill.
      # Detection is pure bash and costs nothing on repos shipping no PHP.
      - name: Detect PHP tests
        id: detect_php
        env:
          PHP_GLOB: ${{ inputs.php_glob }}
        run: |
          shopt -s nullglob globstar
          # shellcheck disable=SC2206  # word splitting is the point: expand the glob
          files=(${PHP_GLOB})
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          if [ ${#files[@]} -eq 0 ]; then
            echo "No PHP tests matched ${PHP_GLOB}"
          fi

      - name: Set up PHP
        if: steps.detect_php.outputs.count != '0'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php_version }}
          coverage: none

      # --no-plugins on purpose: a skill repo requires
      # netresearch/composer-agent-skill-plugin, and a root install that has not
      # declared it under config.allow-plugins aborts non-interactively. Running
      # the tests never needs the plugin, so the gate stays independent of each
      # repo's allow-plugins state and adoption cannot break on it.
      - name: Install PHP dependencies
        if: steps.detect_php.outputs.count != '0' && hashFiles('composer.json') != ''
        run: composer install --no-interaction --no-progress --no-plugins

      # always(), like the legs below: the PHP setup now runs first, and a failed
      # composer install must not hide which shell tests pass.
      - name: Shell tests
        id: shell
        if: always()
        env:
          SHELL_GLOB: ${{ inputs.shell_glob }}
        run: |
          shopt -s nullglob globstar
          # shellcheck disable=SC2206  # word splitting is the point: expand the glob
          files=(${SHELL_GLOB})
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell tests matched ${SHELL_GLOB}"
            exit 0
          fi
          rc=0
          for t in "${files[@]}"; do
            echo "::group::$t"
            bash "$t" || { echo "::error file=$t::test failed"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

      # always(): a failing shell suite must not hide the Python results. One
      # run should report every failing test, not the first kind of failure.
      - name: Python tests
        id: python
        if: always()
        env:
          PYTHON_GLOB: ${{ inputs.python_glob }}
        run: |
          shopt -s nullglob globstar
          # shellcheck disable=SC2206  # word splitting is the point: expand the glob
          files=(${PYTHON_GLOB})
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          if [ ${#files[@]} -eq 0 ]; then
            echo "No python tests matched ${PYTHON_GLOB}"
            exit 0
          fi
          # Standalone scripts with a main() and a non-zero exit, not pytest
          # modules — pytest collects nothing from them and exits 5.
          rc=0
          for t in "${files[@]}"; do
            echo "::group::$t"
            python3 "$t" || { echo "::error file=$t::test failed"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

      - name: PHP tests
        if: always() && steps.detect_php.outputs.count != '0'
        env:
          PHP_GLOB: ${{ inputs.php_glob }}
        run: |
          shopt -s nullglob globstar
          # shellcheck disable=SC2206  # word splitting is the point: expand the glob
          files=(${PHP_GLOB})
          rc=0
          for t in "${files[@]}"; do
            echo "::group::$t"
            php "$t" || { echo "::error file=$t::test failed"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

      # A repo that ships executable surface and matched zero tests is the
      # state this workflow exists to surface. Reported always; fatal only when
      # the caller asks for it, so adoption is never a breaking change.
      - name: Report coverage of shipped scripts
        if: always()
        env:
          SHELL_COUNT: ${{ steps.shell.outputs.count }}
          PYTHON_COUNT: ${{ steps.python.outputs.count }}
          PHP_COUNT: ${{ steps.detect_php.outputs.count }}
          REQUIRE_TESTS: ${{ inputs.require_tests }}
        run: |
          shopt -s nullglob globstar
          scripts=(skills/*/scripts/*)
          # Defaulted because `if: always()` can reach this step while an
          # earlier one never wrote its `count=`. Bash reads an empty variable
          # as 0 here, so this is explicitness, not a crash guard.
          total=$(( ${SHELL_COUNT:-0} + ${PYTHON_COUNT:-0} + ${PHP_COUNT:-0} ))
          echo "shipped scripts: ${#scripts[@]} | test files run: $total"
          if [ ${#scripts[@]} -gt 0 ] && [ "$total" -eq 0 ]; then
            msg="repo ships ${#scripts[@]} script(s) under skills/*/scripts/ but no test file was run"
            if [ "$REQUIRE_TESTS" = "true" ]; then
              echo "::error::$msg"
              exit 1
            fi
            echo "::warning::$msg"
          fi
