name: Validate Evals

on:
  workflow_call:
    inputs:
      require_evals:
        description: >-
          Fail when a skill exceeds the breadth threshold (SKILL.md body
          >300 words or >3 reference files) and has no evals.json. Small
          pointer-skills stay exempt. Default false: a missing evals.json
          only emits a warning, unchanged.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-evals:
    name: Eval Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netresearch/skill-repo-skill
          ref: main
          path: .skill-repo-tools
          sparse-checkout: skills/skill-repo/scripts/
          sparse-checkout-cone-mode: false

      - name: Find evals.json
        id: find-evals
        run: |
          EVALS_FILE=""
          for candidate in skills/*/evals/evals.json evals/evals.json; do
            if [[ -f "$candidate" ]]; then
              EVALS_FILE="$candidate"
              break
            fi
          done
          if [[ -z "$EVALS_FILE" ]]; then
            echo "::warning::No evals.json found, skipping validation"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found: $EVALS_FILE"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$EVALS_FILE" >> "$GITHUB_OUTPUT"

      # The samples requirement (retro-skill#92) applies to an eval that is new
      # or whose assertions changed, so the validator needs the same file as it
      # stands on the target branch. The checkout above is the synthetic merge
      # commit at depth 1, so no base is in the tree: fetch the PR's base
      # commit and write that revision's copy of the file out for the
      # validator. Only on pull_request - `github.event.before` is meaningless
      # after a force-push and all-zeros on branch creation, so a push build
      # has no honest base and the requirement stays off there.
      - name: Resolve the base copy of evals.json
        id: base
        if: steps.find-evals.outputs.found == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVALS_PATH: ${{ steps.find-evals.outputs.path }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "::notice::could not fetch base commit $BASE_SHA - the samples requirement for new or changed evals is off for this run"
            exit 0
          fi
          BASE_COPY="$RUNNER_TEMP/evals-base.json"
          if git show --end-of-options "$BASE_SHA:$EVALS_PATH" > "$BASE_COPY"; then
            echo "base: $BASE_SHA:$EVALS_PATH"
          else
            # The file does not exist on the base branch, so every eval in it
            # is new. An empty array says that, and says it distinguishably
            # from a base that could not be read - which the validator fails
            # on rather than silently treating as empty.
            echo "[]" > "$BASE_COPY"
            echo "$EVALS_PATH is new on this branch - every eval in it counts as new"
          fi
          echo "path=$BASE_COPY" >> "$GITHUB_OUTPUT"

      - name: Validate evals structure
        if: steps.find-evals.outputs.found == 'true'
        env:
          EVALS_PATH: ${{ steps.find-evals.outputs.path }}
          # Empty on a push build, and on a PR whose base could not be fetched:
          # the validator then skips the comparison and behaves exactly as it
          # did before this step existed.
          EVALS_BASE_FILE: ${{ steps.base.outputs.path }}
        run: bash .skill-repo-tools/skills/skill-repo/scripts/validate-evals.sh "$EVALS_PATH"

      - name: Enforce required evals for broad skills
        if: steps.find-evals.outputs.found == 'false' && inputs.require_evals == true
        run: bash .skill-repo-tools/skills/skill-repo/scripts/validate-evals.sh --require-evals
