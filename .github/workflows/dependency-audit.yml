name: Dependency Audit

on:
  workflow_call:
    inputs:
      scripts-paths:
        description: "JSON array of directories to scan recursively for Python scripts with PEP 723 inline metadata."
        type: string
        default: '["skills"]'
      pip-audit-args:
        description: "Extra arguments passed to pip-audit."
        type: string
        default: "--desc"

permissions: {}

jobs:
  audit:
    name: Audit PEP 723 inline dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Second checkout: this workflow runs in the CALLER's repo, so the
      # hash-locked tool requirements must come from skill-repo-skill itself.
      - name: Fetch locked tool requirements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netresearch/skill-repo-skill
          ref: main
          path: .skill-repo-ci
          persist-credentials: false
          sparse-checkout: |
            .github/requirements
          sparse-checkout-cone-mode: false

      - name: Collect PEP 723 dependencies
        env:
          SCAN_PATHS_JSON: ${{ inputs.scripts-paths }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import pathlib
          import re
          import sys
          import tomllib

          # Canonical PEP 723 parser per https://peps.python.org/pep-0723/#reference-implementation
          PEP723_RE = re.compile(
              r"(?m)^# /// (?P<type>[a-zA-Z0-9-]+)$\s(?P<content>(^#(| .*)$\s)+)^# ///$"
          )

          def read_script_block(source: str) -> dict | None:
              matches = [m for m in PEP723_RE.finditer(source) if m.group("type") == "script"]
              if len(matches) > 1:
                  raise ValueError("multiple 'script' blocks")
              if not matches:
                  return None
              content = "".join(
                  line[2:] if line.startswith("# ") else line[1:]
                  for line in matches[0].group("content").splitlines(keepends=True)
              )
              return tomllib.loads(content)

          deps: set[str] = set()
          scanned = 0
          skipped_decode = 0
          skipped_parse = 0
          for path in json.loads(os.environ["SCAN_PATHS_JSON"]):
              root = pathlib.Path(path)
              if not root.exists():
                  print(f"::warning::{path} does not exist, skipping")
                  continue
              for f in root.rglob("*.py"):
                  scanned += 1
                  try:
                      source = f.read_text(encoding="utf-8", errors="replace")
                  except OSError as e:
                      print(f"::warning file={f}::cannot read: {e}")
                      skipped_decode += 1
                      continue
                  try:
                      block = read_script_block(source)
                  except (ValueError, tomllib.TOMLDecodeError) as e:
                      print(f"::warning file={f}::malformed PEP 723 block: {e}")
                      skipped_parse += 1
                      continue
                  if block:
                      for dep in block.get("dependencies", []):
                          deps.add(dep)

          pathlib.Path("/tmp/requirements-audit.txt").write_text(
              "\n".join(sorted(deps)) + ("\n" if deps else "")
          )
          print(
              f"Scanned {scanned} file(s); {skipped_decode} unreadable, "
              f"{skipped_parse} malformed; {len(deps)} unique dependencies:"
          )
          for d in sorted(deps):
              print(f"  {d}")
          if not deps:
              print("::notice::No PEP 723 dependencies discovered; pip-audit will be skipped.")
          PYEOF

      - name: Audit dependencies
        env:
          PIP_AUDIT_ARGS: ${{ inputs.pip-audit-args }}
        run: |
          if [[ ! -s /tmp/requirements-audit.txt ]]; then
            echo "No dependencies to audit."
            exit 0
          fi
          # Hash-locked tool env: requirements compiled with
          # `uv pip compile --universal --generate-hashes`; --require-hashes
          # rejects any artifact not pinned by digest, --only-binary blocks
          # sdist setup scripts. Bump via .github/requirements/pip-audit.txt.
          python3 -m venv "$RUNNER_TEMP/audit-env"
          "$RUNNER_TEMP/audit-env/bin/pip" install --quiet --require-hashes --only-binary :all: -r .skill-repo-ci/.github/requirements/pip-audit.txt
          # shellcheck disable=SC2086  # intentional: PIP_AUDIT_ARGS is a list of flags
          "$RUNNER_TEMP/audit-env/bin/pip-audit" -r /tmp/requirements-audit.txt $PIP_AUDIT_ARGS
